<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>흰디·브레드 촬영 샷리스트</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0d1117;--panel:#161b22;--panel2:#1c2330;--line:#2a3340;--tx:#e6edf3;--tx2:#9fb0c3;
--tx3:#6b7d91;--acc:#4c9aff;--ok:#3fb950;--warn:#e3b341;--red:#f85149;--photo:#a371f7;--ext:#f0883e}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body{padding-bottom:86px}
h1,h3{margin:0}
header{position:sticky;top:0;z-index:50;background:rgba(13,17,23,.97);border-bottom:1px solid var(--line);
padding:10px 12px 0;padding-top:max(10px,env(safe-area-inset-top))}
.h-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.h-top h1{font-size:15px;font-weight:700;letter-spacing:-.2px}
.sync{margin-left:auto;font-size:11px;padding:4px 8px;border-radius:999px;border:1px solid var(--line);
background:var(--panel);color:var(--tx3);white-space:nowrap;cursor:pointer}
.sync.on{color:var(--ok);border-color:rgba(63,185,80,.4);background:rgba(63,185,80,.1)}
.sync.off{color:var(--warn);border-color:rgba(227,179,65,.4);background:rgba(227,179,65,.1)}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tab{flex:1;padding:8px 4px;border-radius:8px 8px 0 0;background:var(--panel);border:1px solid var(--line);
border-bottom:none;color:var(--tx2);font-size:13px;font-weight:600;text-align:center;cursor:pointer}
.tab.on{background:var(--panel2);color:var(--tx);box-shadow:inset 0 2px 0 var(--acc)}
.tab small{display:block;font-size:10px;font-weight:500;color:var(--tx3);margin-top:1px}
.tab.on small{color:var(--acc)}
.stats{display:flex;gap:6px;padding-bottom:9px}
.stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
.stat .lb{font-size:10px;color:var(--tx3);white-space:nowrap}
.stat .vl{font-size:17px;font-weight:700;letter-spacing:-.5px}
.stat.crit .vl{color:var(--red)}
.stat.done .vl{color:var(--ok)}
.bar{height:4px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--ok)}
.stat.crit .bar i{background:var(--red)}
.filters{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:6px 11px;border-radius:999px;background:var(--panel);border:1px solid var(--line);
color:var(--tx2);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:#04121f}
.chip.on.rr{background:var(--red);border-color:var(--red);color:#fff}
.now-bar{margin:0 12px 10px;padding:8px 10px;border-radius:8px;background:rgba(76,154,255,.1);
border:1px solid rgba(76,154,255,.35);font-size:12.5px;color:var(--acc);display:flex;gap:6px;align-items:center}
.now-bar b{color:var(--tx)}
.now-bar button{margin-left:auto;background:var(--acc);color:#04121f;border:0;border-radius:6px;
padding:4px 9px;font-size:11.5px;font-weight:700;cursor:pointer}
.todo{margin:0 12px 10px;border:1px solid rgba(248,81,73,.35);background:rgba(248,81,73,.07);border-radius:10px;overflow:hidden}
.todo h3{padding:9px 11px;font-size:12.5px;color:var(--red);display:flex;cursor:pointer;align-items:center;gap:6px}
.todo h3 .cnt{margin-left:auto;font-weight:800}
.todo ul{margin:0;padding:0 11px 10px;list-style:none;max-height:210px;overflow:auto}
.todo li{font-size:12.5px;color:var(--tx2);padding:4px 0;border-top:1px solid rgba(248,81,73,.15);cursor:pointer}
.todo li b{color:var(--tx);font-weight:600}
.todo li .t{color:var(--tx3);font-size:11px}
.todo.fold ul{display:none}
.blk{margin:0 12px 10px}
.blk-h{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel2);
border:1px solid var(--line);border-radius:9px 9px 0 0}
.blk-h .t{font-size:11px;color:var(--tx3);flex:0 0 auto}
.blk-h .n{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk-h .p{margin-left:auto;font-size:11.5px;color:var(--tx2);flex:0 0 auto}
.blk-h.ext{background:rgba(240,136,62,.14);border-color:rgba(240,136,62,.4)}
.blk-h.ext .n{color:var(--ext)}
.blk-h.cur{box-shadow:0 0 0 2px var(--acc)}
.blk-b{border:1px solid var(--line);border-top:none;border-radius:0 0 9px 9px;overflow:hidden}
.shot{border-top:1px solid var(--line);padding:10px;background:var(--panel)}
.shot:first-child{border-top:none}
.shot.done{background:rgba(63,185,80,.06)}
.s-top{display:flex;gap:8px;align-items:flex-start}
.s-main{flex:1;min-width:0}
.s-name{font-size:14.5px;font-weight:650;line-height:1.3}
.shot.done .s-name{color:var(--tx2);text-decoration:line-through}
.s-meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tg{font-size:10.5px;padding:2px 6px;border-radius:5px;background:var(--panel2);color:var(--tx2);border:1px solid var(--line)}
.tg.pri{color:var(--red);border-color:rgba(248,81,73,.4);background:rgba(248,81,73,.1);font-weight:700}
.tg.ph{color:var(--photo);border-color:rgba(163,113,247,.4);background:rgba(163,113,247,.1)}
.tg.mv{color:var(--acc);border-color:rgba(76,154,255,.35);background:rgba(76,154,255,.1)}
.s-frame{margin-top:7px;font-size:12.5px;color:var(--tx2)}
.s-note{margin-top:6px;font-size:12px;color:var(--warn);background:rgba(227,179,65,.08);
border-left:2px solid var(--warn);padding:5px 8px;border-radius:0 5px 5px 0}
.acts{display:flex;gap:6px;margin-top:9px}
.act{flex:1;padding:10px 6px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel2);
color:var(--tx2);font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;
justify-content:center;gap:5px;user-select:none;-webkit-user-select:none}
.act .bx{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--tx3);flex:0 0 auto;position:relative}
.act.on{background:rgba(63,185,80,.14);border-color:var(--ok);color:var(--ok)}
.act.on .bx{background:var(--ok);border-color:var(--ok)}
.act.on .bx:after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;
border:solid #04121f;border-width:0 2px 2px 0;transform:rotate(45deg)}
.act .who{font-size:10px;font-weight:600;opacity:.75}
.no{font-size:10.5px;color:var(--tx3);padding-top:3px;flex:0 0 auto;min-width:20px}
.ck-sec{margin:0 12px 10px}
.ck-h{padding:8px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:9px 9px 0 0;font-size:13px;font-weight:700;display:flex}
.ck-h .p{margin-left:auto;font-size:11.5px;color:var(--tx2);font-weight:600}
.ck-b{border:1px solid var(--line);border-top:none;border-radius:0 0 9px 9px}
.ck-row{display:flex;align-items:center;gap:8px;padding:9px 10px;border-top:1px solid var(--line);background:var(--panel)}
.ck-row:first-child{border-top:none}
.ck-row .lb{flex:1;font-size:13px;min-width:0}
.ck-row .bt{display:flex;gap:4px;flex:0 0 auto}
.mini{width:42px;padding:7px 0;text-align:center;border-radius:6px;border:1.5px solid var(--line);
background:var(--panel2);color:var(--tx3);font-size:10.5px;font-weight:700;cursor:pointer}
.mini.on{background:rgba(63,185,80,.16);border-color:var(--ok);color:var(--ok)}
.ck-legend{display:flex;gap:4px;justify-content:flex-end;padding:6px 10px 0;font-size:10px;color:var(--tx3)}
.ck-legend span{width:42px;text-align:center}
footer{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(13,17,23,.97);
border-top:1px solid var(--line);padding:8px 12px;padding-bottom:max(8px,env(safe-area-inset-bottom));
display:flex;gap:6px;align-items:center}
footer .who{font-size:11px;color:var(--tx3);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
footer button{background:var(--panel2);border:1px solid var(--line);color:var(--tx2);border-radius:7px;
padding:8px 11px;font-size:12px;font-weight:600;cursor:pointer;flex:0 0 auto}
footer button.pri{background:var(--acc);border-color:var(--acc);color:#04121f}
.empty{padding:26px 12px;text-align:center;color:var(--tx3);font-size:13px}
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:18px}
.modal.on{display:flex}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;max-width:400px;width:100%}
.mbox h3{font-size:15px;margin-bottom:10px}
.mbox p{font-size:12.5px;color:var(--tx2);margin:0 0 12px}
.mbox input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);
color:var(--tx);font-size:14px;margin-bottom:8px;font-family:inherit}
.mbox .row{display:flex;gap:6px;margin-top:6px}
.mbox button{flex:1;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);
color:var(--tx);font-size:13px;font-weight:700;cursor:pointer}
.mbox button.pri{background:var(--acc);border-color:var(--acc);color:#04121f}
.mbox .hint{font-size:11px;color:var(--tx3);margin-top:10px;line-height:1.5}
</style>
</head>
<body>
<header>
 <div class="h-top"><h1>촬영 샷리스트</h1><div class="sync" id="syncPill">연결 중…</div></div>
 <div class="tabs">
  <div class="tab on" data-tab="day1">DAY1 흰디<small>9/16 (수)</small></div>
  <div class="tab" data-tab="day2">DAY2 브레드<small>9/17 (목)</small></div>
  <div class="tab" data-tab="chk">체크리스트<small>A~F 공통</small></div>
 </div>
 <div class="stats" id="stats"></div>
</header>
<div class="filters" id="filters">
 <div class="chip on" data-f="all">전체</div>
 <div class="chip rr" data-f="todo">남은 컷</div>
 <div class="chip" data-f="done">찍은 컷</div>
 <div class="chip" data-f="pri">★★★ 필수</div>
 <div class="chip" data-f="photo">사진 포함</div>
 <div class="chip" data-f="ext">외부 전광판</div>
 <div class="chip" data-f="move">짐벌/무빙</div>
</div>
<div id="todo"></div>
<div id="nowbar"></div>
<div id="main"></div>
<footer>
 <div class="who" id="whoLabel"></div>
 <button id="btnCopy">현황 복사</button>
 <button id="btnRoom">공유</button>
 <button class="pri" id="btnNow">지금 시간</button>
</footer>

<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>

    pushQ={};
    pull().then(function(){
      var out={}; Object.keys(state).forEach(function(k0){ out[ENC[k0]||encKey(k0)]=state[k0]; });
      return fetch(jbUrl(), {method:'PUT', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({v:1, updated:Date.now(), entries:out})});
    }).then(function(r){ if(r&&!r.ok) throw new Error('HTTP '+r.status); lastErr=''; pill('연결됨 '+hhmm(),'on'); })
      .catch(function(e){ lastErr=String(e&&e.message||e); pill('오프라인 · 이 기기에만 저장','off'); });
  }
}
function stopSync(){ if(es){ try{es.close();}catch(e){} es=null; } if(pollTimer){ clearInterval(pollTimer); pollTimer=null; } }
function startSync(){
  stopSync(); if(!be) { pill('개인 모드 · 공유하려면 탭',''); return; }
  pill('연결 중…','');
  pull();
  if(be.type==='firebase' && window.EventSource){
    try{
      es = new EventSource(fbUrl());
      es.addEventListener('put', function(ev){ applyStream(ev.data); });
      es.addEventListener('patch', function(ev){ applyStream(ev.data); });
      es.onerror = function(){ if(!pollTimer) pollTimer=setInterval(pull, 5000); };
    }catch(e){ pollTimer=setInterval(pull, 5000); }
  } else {
    pollTimer = setInterval(pull, 5000);
  }
}
function applyStream(raw){
  try{
    var m=JSON.parse(raw); if(!m) return;
    var p=m.path||'/', d=m.data, obj={};
    if(p==='/'){ obj = d || {}; }
    else { var seg=p.replace(/^\//,'').split('/')[0]; if(!seg) return;
           if(d && typeof d==='object' && d.t!==undefined) obj[seg]=d; else return; }
    if(mergeIn(obj)){ saveLocal(); render(true); }
    lastErr=''; pill('연결됨 '+hhmm(),'on');
  }catch(e){}
}
function setTask(key, val){
  state[key] = {v: val?1:0, t: Date.now(), by: me||''};
  saveLocal(); queuePush(key); render(true);
}
/* ---------- data helpers ---------- */
function k(id,t){ return id+'::'+t; }
function isDone(s,t){ var e=state[k(s.id,t)]; return !!(e && e.v); }
function whoDid(s,t){ var e=state[k(s.id,t)]; return (e&&e.v&&e.by)?e.by:''; }
function shotDone(s){ for(var i=0;i<s.tasks.length;i++) if(!isDone(s,s.tasks[i])) return false; return true; }
function totalUnits(l){ var n=0; l.forEach(function(s){ n+=s.tasks.length; }); return n; }
function doneUnits(l){ var n=0; l.forEach(function(s){ s.tasks.forEach(function(t){ if(isDone(s,t)) n++; }); }); return n; }
function parseSlot(t){ var m=t.match(/(\d{2}):(\d{2})~(\d{2}):(\d{2})/); return m?{s:+m[1]*60+ +m[2], e:+m[3]*60+ +m[4]}:null; }
function currentKey(list){ var d=new Date(), n=d.getHours()*60+d.getMinutes();
  for(var i=0;i<list.length;i++){ var p=parseSlot(list[i].time); if(p&&n>=p.s&&n<p.e) return list[i].time+'|'+list[i].block; }
  return null; }
/* ---------- render ---------- */
function card(lb,v,tot,cls,inv){ var pct=tot?Math.round((inv?(tot-v):v)/tot*100):0;
  return '<div class="stat '+cls+'"><div class="lb">'+lb+'</div><div class="vl">'+v+
   '<span style="font-size:11px;color:var(--tx3);font-weight:500"> / '+tot+'</span></div>'+
   '<div class="bar"><i style="width:'+pct+'%"></i></div></div>'; }
function renderStats(){
  if(tab==='chk'){
    var items=[], d=0, cols=['d1v','d1p','d2v','d2p'];
    Object.keys(DATA.chk).forEach(function(sec){ DATA.chk[sec].forEach(function(it){ items.push(sec+'|'+it); }); });
    items.forEach(function(i){ cols.forEach(function(c){ var e=state['ck::'+i+'::'+c]; if(e&&e.v) d++; }); });
    $('stats').innerHTML = card('전체 체크', d, items.length*4, 'done'); return;
  }
  var list=DATA[tab], pri=list.filter(function(s){return s.pri==='★★★';});
  var ph=list.filter(function(s){return s.tasks.indexOf('사진')>=0;}), phDn=0;
  ph.forEach(function(s){ if(isDone(s,'사진')) phDn++; });
  $('stats').innerHTML = card('찍은 컷',doneUnits(list),totalUnits(list),'done') +
    card('★★★ 남음', totalUnits(pri)-doneUnits(pri), totalUnits(pri), 'crit', true) +
    card('사진', phDn, ph.length, '');
}
function renderTodo(){
  var box=$('todo'); if(tab==='chk'){ box.innerHTML=''; return; }
  var rows=[]; DATA[tab].forEach(function(s){ if(s.pri!=='★★★') return;
    s.tasks.forEach(function(t){ if(!isDone(s,t)) rows.push({s:s,t:t}); }); });
  if(!rows.length){ box.innerHTML='<div class="todo" style="border-color:rgba(63,185,80,.4);background:rgba(63,185,80,.07)"><h3 style="color:var(--ok)">✓ 필수 컷 전부 확보 완료</h3></div>'; return; }
  box.innerHTML='<div class="todo '+(todoFold?'fold':'')+'" id="todoBox"><h3>⚠ 아직 안 찍은 필수 컷 <span class="cnt">'+rows.length+'</span></h3><ul>'+
    rows.map(function(r){ return '<li data-go="'+r.s.id+'"><span class="t">'+r.s.time+'</span> · <b>'+esc(r.s.name)+'</b> <span class="t">('+r.t+')</span></li>'; }).join('')+'</ul></div>';
  box.querySelector('#todoBox h3').onclick=function(){ todoFold=!todoFold; renderTodo(); };
  Array.prototype.forEach.call(box.querySelectorAll('li[data-go]'), function(li){
    li.onclick=function(){ var el=$('shot-'+li.getAttribute('data-go'));
      if(el){ el.scrollIntoView({behavior:'smooth',block:'center'});
        el.style.boxShadow='inset 0 0 0 2px var(--acc)'; setTimeout(function(){el.style.boxShadow='';},1600);} };
  });
}
function renderNow(){
  var box=$('nowbar'); if(tab==='chk'){ box.innerHTML=''; return; }
  var ck=currentKey(DATA[tab]); if(!ck){ box.innerHTML=''; return; }
  var p=ck.split('|');
  box.innerHTML='<div class="now-bar">지금 진행 중 &nbsp;<b>'+p[0]+' · '+esc(p[1])+'</b><button id="goNow">이동</button></div>';
  $('goNow').onclick=jumpNow;
}
function jumpNow(){
  var ck=currentKey(DATA[tab]); if(!ck){ alert('현재 시각에 해당하는 촬영 블록이 없습니다.'); return; }
  var els=document.querySelectorAll('[data-bk]');
  for(var i=0;i<els.length;i++) if(els[i].getAttribute('data-bk')===ck){ els[i].scrollIntoView({behavior:'smooth',block:'start'}); return; }
}
function pass(s){
  if(filter==='todo') return !shotDone(s);
  if(filter==='done') return shotDone(s);
  if(filter==='pri') return s.pri==='★★★';
  if(filter==='photo') return s.tasks.indexOf('사진')>=0;
  if(filter==='ext') return s.block.indexOf('외부 전광판')>=0;
  if(filter==='move') return s.mv.indexOf('무빙')>=0;
  return true;
}
function shotHTML(s){
  return '<div class="shot '+(shotDone(s)?'done':'')+'" id="shot-'+s.id+'"><div class="s-top">'+
   '<div class="no">'+s.no+'</div><div class="s-main"><div class="s-name">'+esc(s.name)+'</div><div class="s-meta">'+
   (s.pri==='★★★'?'<span class="tg pri">★★★ 필수</span>':(s.pri==='★★'?'<span class="tg">★★</span>':''))+
   (s.fmt&&s.fmt!=='—'?'<span class="tg '+(s.tasks.indexOf('사진')>=0?'ph':'')+'">'+esc(s.fmt)+'</span>':'')+
   (s.gear&&s.gear!=='—'?'<span class="tg">'+esc(s.gear)+'</span>':'')+
   (s.mv&&s.mv!=='—'?'<span class="tg '+(s.mv.indexOf('무빙')>=0?'mv':'')+'">'+esc(s.mv)+'</span>':'')+
   (s.len&&s.len!=='—'?'<span class="tg">'+esc(s.len)+'</span>':'')+
   (s.chk&&s.chk!=='—'?'<span class="tg">체크 '+esc(s.chk)+'</span>':'')+'</div>'+
   (s.frame&&s.frame!=='—'?'<div class="s-frame">'+esc(s.frame)+'</div>':'')+
   (s.note?'<div class="s-note">'+esc(s.note)+'</div>':'')+
   '<div class="acts">'+s.tasks.map(function(t){ var w=whoDid(s,t);
     return '<div class="act '+(isDone(s,t)?'on':'')+'" data-id="'+s.id+'" data-t="'+t+'"><span class="bx"></span>'+t+
            (w?'<span class="who">'+esc(w)+'</span>':'')+'</div>'; }).join('')+
   '</div></div></div></div>';
}
function renderMain(){
  var main=$('main');
  $('filters').style.display = tab==='chk'?'none':'flex';
  if(tab==='chk'){ renderChk(main); return; }
  var list=DATA[tab], ck=currentKey(list), groups=[], cur=null;
  list.forEach(function(s){ var key=s.time+'|'+s.block;
    if(!cur||cur.key!==key){ cur={key:key,time:s.time,block:s.block,items:[]}; groups.push(cur); }
    cur.items.push(s); });
  var html='', shown=0;
  groups.forEach(function(g){
    var vis=g.items.filter(pass); if(!vis.length) return; shown+=vis.length;
    var ext=g.block.indexOf('외부 전광판')>=0;
    html+='<div class="blk"><div class="blk-h '+(ext?'ext':'')+' '+(ck===g.key?'cur':'')+'" data-bk="'+esc(g.key)+'">'+
      '<span class="t">'+g.time+'</span><span class="n">'+esc(g.block)+'</span><span class="p">'+
      doneUnits(g.items)+'/'+totalUnits(g.items)+'</span></div><div class="blk-b">'+vis.map(shotHTML).join('')+'</div></div>';
  });
  main.innerHTML = shown?html:'<div class="empty">해당하는 컷이 없습니다.</div>';
  Array.prototype.forEach.call(main.querySelectorAll('.act'), function(a){
    a.onclick=function(){
      var key=k(a.getAttribute('data-id'), a.getAttribute('data-t'));
      var cur=state[key]; setTask(key, !(cur&&cur.v));
    };
  });
}
function renderChk(main){
  var cols=[['d1v','D1영'],['d1p','D1사'],['d2v','D2영'],['d2p','D2사']], html='';
  Object.keys(DATA.chk).forEach(function(sec){
    var arr=DATA.chk[sec], d=0;
    arr.forEach(function(it){ cols.forEach(function(c){ var e=state['ck::'+sec+'|'+it+'::'+c[0]]; if(e&&e.v) d++; }); });
    html+='<div class="ck-sec"><div class="ck-h">'+esc(sec)+'<span class="p">'+d+'/'+(arr.length*4)+'</span></div>'+
     '<div class="ck-legend">'+cols.map(function(c){return '<span>'+c[1]+'</span>';}).join('')+'</div><div class="ck-b">'+
     arr.map(function(it){ return '<div class="ck-row"><div class="lb">'+esc(it)+'</div><div class="bt">'+
       cols.map(function(c){ var key='ck::'+sec+'|'+it+'::'+c[0]; var e=state[key];
         return '<div class="mini '+((e&&e.v)?'on':'')+'" data-key="'+esc(key)+'">'+c[1]+'</div>'; }).join('')+
       '</div></div>'; }).join('')+'</div></div>';
  });
  main.innerHTML=html;
  Array.prototype.forEach.call(main.querySelectorAll('.mini'), function(m){
    m.onclick=function(){ var key=m.getAttribute('data-key'); var e=state[key]; setTask(key, !(e&&e.v)); };
  });
}
function render(keep){
  var y=window.scrollY||0;
  renderStats(); renderTodo(); renderNow(); renderMain();
  $('whoLabel').textContent = (me?'체크 이름: '+me:'이름 미설정') + (be?(' · 방 '+be.room||''):' · 개인 모드');
  if(keep) window.scrollTo(0,y);
}
/* ---------- modal ---------- */
function modal(html){ $('mbox').innerHTML=html; $('modal').classList.add('on'); }
function closeModal(){ $('modal').classList.remove('on'); }
$('modal').onclick=function(e){ if(e.target===$('modal')) closeModal(); };
function askName(next){
  modal('<h3>이름을 입력하세요</h3><p>누가 어떤 컷을 체크했는지 표시됩니다.</p>'+
    '<input id="mName" placeholder="예: 상우" value="'+esc(me)+'">'+
    '<div class="row"><button class="pri" id="mOk">확인</button></div>');
  $('mName').focus();
  $('mOk').onclick=function(){ me=($('mName').value||'').trim().slice(0,8); saveLocal(); closeModal(); render(true); if(next) next(); };
}
function roomModal(){
  var link = location.origin + location.pathname + (be ? ('#'+beHash()) : '');
  var cur = be ? (be.type==='firebase' ? 'Firebase · 방 '+be.room : 'jsonblob · '+be.id) : '연결 안 됨 (이 기기에만 저장)';
  modal('<h3>실시간 공유</h3>'+
   '<p>현재 상태: <b>'+esc(cur)+'</b>'+(lastErr?'<br><span style="color:var(--warn)">최근 오류: '+esc(lastErr)+'</span>':'')+'</p>'+
   (be ? '<input id="mUrl" readonly value="'+esc(link)+'">'+
         '<div class="row"><button class="pri" id="mCopy">주소 복사</button><button id="mTest">연결 테스트</button></div>'+
         '<div class="row"><button id="mLeave">연결 해제</button></div>'
       : '')+
   '<p style="margin-top:14px">Firebase 데이터베이스 주소를 붙여넣으면 실시간으로 연동됩니다.</p>'+
   '<input id="mFb" placeholder="https://프로젝트-default-rtdb.firebaseio.com" value="'+esc(be&&be.type==="firebase"?be.base:"")+'">'+
   '<input id="mRoom" placeholder="방 이름 (예: shoot0916)" value="'+esc(be&&be.room?be.room:"shoot0916")+'">'+
   '<div class="row"><button class="pri" id="mFbGo">연결</button></div>'+
   '<div class="row" style="margin-top:12px"><button id="mName2">이름 변경</button><button id="mReset">전체 초기화</button></div>'+
   '<div class="hint">· 연결하면 같은 주소·같은 방 이름을 연 사람끼리 체크가 즉시 공유됩니다.<br>'+
   '· 인터넷이 끊겨도 이 기기에 저장되고, 다시 연결되면 자동으로 합쳐집니다.<br>'+
   '· 같은 컷을 두 사람이 만지면 나중에 누른 쪽이 반영됩니다.</div>');
  if(be){
    $('mCopy').onclick=function(){ var i=$('mUrl'); i.select();
      if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(i.value).then(function(){alert('주소를 복사했습니다.');},function(){});
      else { try{document.execCommand('copy'); alert('주소를 복사했습니다.');}catch(e){} } };
    $('mTest').onclick=function(){ pull().then(function(){
      alert(lastErr ? ('연결 실패\n'+lastErr) : '연결 정상입니다. 동기화되고 있습니다.'); }); };
    $('mLeave').onclick=function(){ be=null; stopSync(); location.hash=''; saveLocal(); closeModal(); render(true); pill('개인 모드 · 공유하려면 탭',''); };
  }
  $('mFbGo').onclick=function(){
    var base=($('mFb').value||'').trim(), rm=($('mRoom').value||'').trim()||'shoot0916';
    if(!base){ alert('Firebase 주소를 입력하세요.'); return; }
    if(base.indexOf('http')!==0) base='https://'+base;
    base = base.replace(/\/+$/,'');
    be={type:'firebase', base:base, room:rm.replace(/[^A-Za-z0-9_-]/g,'')};
    location.hash = beHash(); saveLocal(); closeModal(); startSync(); render(true);
    setTimeout(function(){ if(lastErr) alert('연결 실패\n'+lastErr+'\n\n주소와 데이터베이스 규칙(읽기/쓰기 허용)을 확인하세요.'); }, 2500);
  };
  $('mName2').onclick=function(){ askName(roomModal); };
  $('mReset').onclick=function(){ if(confirm('모든 체크를 초기화합니다. 공유 중이면 모두에게 반영됩니다.')){
    var now=Date.now(); Object.keys(state).forEach(function(kk){ state[kk]={v:0,t:now,by:me}; queuePush(kk); });
    saveLocal(); closeModal(); render(); } };
}
function beHash(){
  if(!be) return '';
  if(be.type==='firebase') return 'fb='+encodeURIComponent(be.base)+'&room='+encodeURIComponent(be.room);
  return 'blob='+encodeURIComponent(be.id);
}
/* ---------- shell ---------- */
Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(t){
  t.onclick=function(){ Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(x){x.classList.remove('on');});
    t.classList.add('on'); tab=t.getAttribute('data-tab'); window.scrollTo(0,0); render(); }; });
Array.prototype.forEach.call(document.querySelectorAll('.chip'), function(c){
  c.onclick=function(){ Array.prototype.forEach.call(document.querySelectorAll('.chip'),function(x){x.classList.remove('on');});
    c.classList.add('on'); filter=c.getAttribute('data-f'); render(); }; });
$('btnNow').onclick=jumpNow;
$('btnRoom').onclick=roomModal;
$('syncPill').onclick=function(){ if(be) pull(); else roomModal(); };
$('btnCopy').onclick=function(){
  var lines=[];
  ['day1','day2'].forEach(function(d){
    var list=DATA[d], pri=list.filter(function(s){return s.pri==='★★★';});
    lines.push('['+(d==='day1'?'DAY1 흰디 9/16':'DAY2 브레드 9/17')+'] '+doneUnits(list)+'/'+totalUnits(list)+
      ' 완료 · 필수 미확보 '+(totalUnits(pri)-doneUnits(pri))+'건');
    list.forEach(function(s){ if(s.pri!=='★★★') return;
      s.tasks.forEach(function(t){ if(!isDone(s,t)) lines.push('  - '+s.time+' '+s.name+' ('+t+')'); }); });
  });
  var txt=lines.join('\n');
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function(){alert('현황을 복사했습니다.');},function(){prompt('복사하세요',txt);});
  else prompt('복사하세요', txt);
};
/* ---------- boot ---------- */
loadLocal();
(function(){
  var h = location.hash.replace(/^#/,''); if(!h) return;
  var q={}; h.split('&').forEach(function(p){ var i=p.indexOf('='); if(i>0) q[p.slice(0,i)]=decodeURIComponent(p.slice(i+1)); });
  if(q.fb) be={type:'firebase', base:q.fb.replace(/\/+$/,''), room:q.room||'shoot0916'};
  else if(q.blob) be={type:'jsonblob', id:q.blob};
  else if(q.room && !q.fb) be={type:'jsonblob', id:q.room};
})();
render();
startSync();
setInterval(function(){ renderNow(); }, 30000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden && be) pull(); });
if(!me) setTimeout(function(){ askName(); }, 400);
})();
</script>
</body>
</html>
